</defs>
<text x="0" y="80" class="lab rowlab">As observed</text>
<line x1="138" y1="75" x2="432" y2="75" class="base"/>
<line x1="150" y1="75" x2="150" y2="31" class="arrow var" marker-end="url(#ah2)"/>
<line x1="180" y1="75" x2="180" y2="107" class="arrow var" marker-end="url(#ah2)"/>
<line x1="210" y1="75" x2="210" y2="55" class="arrow var" marker-end="url(#ah2)"/>
<line x1="240" y1="75" x2="240" y2="123" class="arrow var" marker-end="url(#ah2)"/>
<line x1="270" y1="75" x2="270" y2="47" class="arrow var" marker-end="url(#ah2)"/>
<line x1="300" y1="75" x2="300" y2="97" class="arrow var" marker-end="url(#ah2)"/>
<line x1="330" y1="75" x2="330" y2="37" class="arrow var" marker-end="url(#ah2)"/>
<line x1="360" y1="75" x2="360" y2="117" class="arrow var" marker-end="url(#ah2)"/>
<line x1="390" y1="75" x2="390" y2="59" class="arrow var" marker-end="url(#ah2)"/>
<line x1="420" y1="75" x2="420" y2="87" class="arrow var" marker-end="url(#ah2)"/>
<text x="462" y="82" class="lab eq">=</text>
<line x1="498" y1="75" x2="530" y2="75" class="base"/>
<line x1="514" y1="75" x2="514" y2="85" class="arrow sum" marker-end="url(#ah3)"/>
<text x="0" y="285" class="lab rowlab">All one way</text>
<line x1="138" y1="280" x2="432" y2="280" class="base"/>
