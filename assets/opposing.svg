<svg class="illus" viewBox="0 0 640 300" role="img" aria-labelledby="opp-t" xmlns="http://www.w3.org/2000/svg">
<title id="opp-t">Illustration: variant effects pointing up and down add to almost nothing; the same effects all pointing up add to a large total.</title>
